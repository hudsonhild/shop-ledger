@keyframes p-motion-keyframes-fade-in{to{opacity:1}}
@keyframes p-motion-keyframes-spin{to{transform:rotate(1turn)}}
@keyframes p-motion-keyframes-appear-above{from{transform:translateY(var(--p-space-100));opacity:0}to{transform:none;opacity:1}}
@keyframes p-motion-keyframes-appear-below{from{transform:translateY(calc(var(--p-space-100)*-1));opacity:0}to{transform:none;opacity:1}}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--p-color-bg-inverse);scrollbar-color:var(--p-color-text-disabled) transparent}
body{
  margin:0;min-height:100vh;
  background:var(--p-color-bg-inverse);color:var(--p-color-text);
  font-family:var(--p-font-family-sans);font-size:0.8125rem;line-height:1.25rem;
  font-weight:var(--p-font-weight-regular);-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
a.Polaris-Link{color:var(--p-color-text-link);text-decoration:underline;text-decoration-color:var(--p-color-border-tertiary)}
a.Polaris-Link:hover{color:var(--p-color-text-link-hover);text-decoration:underline}
:focus-visible{outline:var(--p-border-width-050) solid var(--p-color-border-focus);outline-offset:var(--p-space-025);border-radius:var(--p-border-radius-100)}
button{font:inherit;color:inherit}
svg{display:block}
h1,h2,h3,p,dl,dd{margin:0}

/* ---- Text scale, resolved from the --p-text-* tokens */
.t-body-xs{font-size:0.6875rem;line-height:0.75rem}
.t-body-sm{font-size:0.75rem;line-height:1rem}
.t-body-md{font-size:0.8125rem;line-height:1.25rem}
.t-body-lg{font-size:0.875rem;line-height:1.25rem}
.t-heading-xs{font-size:0.75rem;line-height:1rem;font-weight:var(--p-font-weight-semibold)}
.t-heading-sm{font-size:0.8125rem;line-height:1.25rem;font-weight:var(--p-font-weight-semibold)}
.t-heading-md{font-size:0.875rem;line-height:1.25rem;font-weight:var(--p-font-weight-semibold)}
.t-heading-lg{font-size:1.25rem;line-height:1.5rem;font-weight:var(--p-font-weight-semibold);letter-spacing:-0.0125rem}
.t-heading-xl{font-size:1.5rem;line-height:2rem;font-weight:var(--p-font-weight-bold);letter-spacing:-0.0125rem}
.t-subdued{color:var(--p-color-text-secondary)}
.t-medium{font-weight:var(--p-font-weight-medium)}
.t-semibold{font-weight:var(--p-font-weight-semibold)}
.t-num{font-variant-numeric:tabular-nums}
.t-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;margin:0!important;padding:0!important;overflow:hidden!important;clip-path:inset(50%)!important;border:0!important;white-space:nowrap!important}

/* ---- Frame: TopBar (live admin), Navigation, Main */
.Polaris-Frame{position:relative;min-height:100vh}
.Polaris-Frame__TopBar{
  position:fixed;z-index:var(--p-z-index-4);top:0;left:0;right:0;height:var(--pg-top-bar-height);
  display:grid;grid-template-columns:minmax(15rem,1fr) minmax(auto,40rem) 1fr;align-items:center;
  gap:var(--p-space-600);padding:0 var(--p-space-200);color:var(--sl-topbar-text);
}
.TopBar__Left{display:flex;align-items:center;gap:var(--p-space-100);padding-left:var(--p-space-300)}
.TopBar__Brand{display:flex;align-items:center;gap:var(--p-space-200);color:rgb(238,238,238);font-size:0.875rem;font-weight:var(--p-font-weight-semibold);padding:0 var(--p-space-100)}
.TopBar__Brand .glyph{color:rgb(238,238,238)}
.TopBar__Button{
  display:flex;align-items:center;justify-content:center;gap:var(--p-space-100);
  height:2.25rem;min-width:2.25rem;padding:0 var(--p-space-200);border:0;border-radius:var(--p-border-radius-300);
  background:transparent;color:var(--sl-topbar-text);font-size:0.75rem;line-height:1rem;font-weight:var(--p-font-weight-medium);
  cursor:pointer;transition:background-color var(--p-motion-duration-100);
}
.TopBar__Button:hover{background:rgba(255,255,255,.08)}
.TopBar__Button:active{background:rgba(255,255,255,.12)}
.TopBar__Button svg{color:var(--sl-topbar-text)}
.TopBar__Menu{display:none}
.TopBar__Search{
  display:flex;align-items:center;width:100%;height:2.25rem;border-radius:var(--p-border-radius-300);
  background:var(--sl-topbar-pill);color:var(--sl-topbar-text);font-weight:400;cursor:text;
  transition:background-color var(--p-motion-duration-100);
}
.TopBar__Search:hover{background:rgb(48,48,48)}
.TopBar__Search:focus-within{background:rgb(48,48,48);outline:var(--p-border-width-050) solid var(--p-color-border-focus);outline-offset:var(--p-space-025)}
.TopBar__Search svg{flex:0 0 auto;margin:0 var(--p-space-100) 0 var(--p-space-200);color:var(--sl-topbar-text)}
.TopBar__Search input{
  flex:1 1 auto;min-width:0;height:100%;border:0;background:transparent;color:rgb(238,238,238);
  font:inherit;font-size:0.8125rem;line-height:1.25rem;padding:0;outline:0;
}
.TopBar__Search input::placeholder{color:var(--sl-topbar-text)}
.TopBar__Shortcut{display:flex;align-items:center;padding:0 var(--p-space-200) 0 0}
.Polaris-KeyboardKey{
  display:flex;justify-content:center;align-items:center;width:1.25rem;height:1.25rem;margin:0 var(--p-space-050);
  padding:var(--p-space-050) var(--p-space-100);border-radius:var(--p-border-radius-100);
  background:var(--sl-kbd-bg);color:var(--sl-kbd-text);font-size:0.75rem;line-height:1rem;font-weight:var(--p-font-weight-medium);
  font-family:var(--p-font-family-sans);
}
.TopBar__Right{display:flex;align-items:center;justify-content:flex-end;gap:var(--p-space-200);padding-right:0}
.TopBar__Status{display:flex;align-items:center;gap:var(--p-space-200);height:2.25rem;padding:0 var(--p-space-300);border-radius:var(--p-border-radius-300);font-size:0.75rem;line-height:1rem;font-weight:var(--p-font-weight-medium);color:var(--sl-topbar-text);white-space:nowrap}
.TopBar__Status .dot{width:0.5rem;height:0.5rem;border-radius:50%;background:rgba(82,244,144,1);flex:0 0 auto}
.TopBar__Status.warn .dot{background:rgba(226,44,56,1)}
.TopBar__Store{display:flex;align-items:center;gap:var(--p-space-100);white-space:nowrap;height:2.25rem;padding:var(--p-space-100) var(--p-space-200) var(--p-space-100) var(--p-space-100);border-radius:var(--p-border-radius-300);font-size:0.75rem;line-height:1rem;font-weight:var(--p-font-weight-medium);color:var(--sl-topbar-text)}
.TopBar__Store .Polaris-Avatar{width:1.75rem;height:1.75rem;border-radius:var(--p-border-radius-200);font-size:0.75rem}

.Polaris-Frame__Navigation{
  position:fixed;z-index:var(--p-z-index-8);top:var(--pg-top-bar-height);left:0;bottom:0;
  width:var(--pg-navigation-width);display:flex;flex-direction:column;
  background:var(--p-color-nav-bg);border-radius:var(--p-border-radius-300) 0 0 0;overflow-y:auto;scrollbar-width:thin;
  transform:translateX(0);transition:transform var(--p-motion-duration-300) var(--p-motion-ease-out);
}
.Polaris-Navigation__Section{list-style:none;margin:0;padding:var(--p-space-300) 0}
.Polaris-Navigation__Section+.Polaris-Navigation__Section{padding-top:var(--p-space-200);padding-bottom:var(--p-space-400)}
.Polaris-Navigation__ListItem{position:relative;display:flex;flex-wrap:wrap;padding:0 var(--p-space-300) 0 var(--p-space-250,0.625rem)}
.Polaris-Navigation__ItemInnerWrapper{
  position:relative;display:flex;flex-wrap:nowrap;width:100%;border-radius:var(--p-border-radius-200);
  transition:background-color var(--p-motion-duration-150) var(--p-motion-ease-out);
}
.Polaris-Navigation__ItemInnerWrapper:hover{background:var(--p-color-nav-bg-surface-hover)}
.Polaris-Navigation__ItemInnerWrapper--selected,.Polaris-Navigation__ItemInnerWrapper--selected:hover{background:var(--p-color-nav-bg-surface-selected)}
.Polaris-Navigation__Item{
  display:flex;flex-grow:1;align-items:flex-start;max-width:100%;height:1.75rem;
  padding:0 var(--p-space-100) 0 var(--p-space-200);border-radius:var(--p-border-radius-200);color:var(--p-color-text);
}
.Polaris-Navigation__Icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:1.25rem;height:1.25rem;margin:var(--p-space-100) var(--p-space-200) var(--p-space-100) 0;color:var(--p-color-text)}
.Polaris-Navigation__Icon svg{width:1rem;height:1rem}
.Polaris-Navigation__Text{flex:1 1 auto;margin:var(--p-space-100) 0;font-size:0.8125rem;line-height:1.25rem;font-weight:var(--p-font-weight-medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.Polaris-Navigation__ItemInnerWrapper--selected .Polaris-Navigation__Text{font-weight:var(--p-font-weight-semibold)}
.Polaris-Navigation__SectionHeading{display:flex;align-items:center;height:1.5rem;margin:0 0 var(--p-space-050);padding:0 var(--p-space-300)}
.Polaris-Navigation__SectionHeading button{
  display:inline-flex;align-items:center;gap:var(--p-space-100);height:1.5rem;padding:var(--p-space-100) 0.1875rem var(--p-space-100) var(--p-space-200);
  border:0;border-radius:var(--p-border-radius-200);background:transparent;font-size:0.8125rem;line-height:1rem;font-weight:var(--p-font-weight-regular);color:var(--p-color-text);cursor:default;
}
.Polaris-Navigation__SectionHeading svg{width:0.3125rem;height:1rem;color:var(--p-color-icon-secondary)}
.Polaris-Navigation__Foot{margin-top:auto;padding:var(--p-space-300) var(--p-space-500);font-family:var(--p-font-family-mono);font-size:0.6875rem;line-height:1rem;color:var(--p-color-text-secondary)}

<div class="Polaris-Frame" id="frame">

  <header class="Polaris-Frame__TopBar">

      <button class="TopBar__Button TopBar__Menu" type="button" id="nav-toggle" aria-label="Open navigation">__ICON_MENU__</button>
      <a class="TopBar__Brand" href="__PREFIX__index.html">__WORDMARK__<span class="name">Shop Ledger</span></a>
    </div>
    <label class="TopBar__Search" id="topbar-search">
      __ICON_SEARCH__
      <input type="search" id="search" placeholder="__SEARCH_PLACEHOLDER__" autocomplete="off" aria-label="Search">
      <span class="TopBar__Shortcut"><kbd class="Polaris-KeyboardKey">⌘</kbd><kbd class="Polaris-KeyboardKey">K</kbd></span>
    </label>
    <div class="TopBar__Right">
      __RUNPILL__
      <span class="TopBar__Status" data-tooltip="ScrapeCreators credits remaining">__ICON_MONEY__ __CREDITS__</span>

    __NAV__
    <div class="Polaris-Navigation__Foot">__FOOT__</div>
  </nav>
  <div class="Polaris-Backdrop" id="backdrop"></div>

      __CONTENT__
    </div>
  </main>
  <div class="Polaris-Frame-ToastManager" id="toasts"></div>
</div>
<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var frame = document.getElementById("frame");

  /* Navigation drawer below 48em: translateX 300ms ease-out, backdrop fades in over 200ms. */

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeNav(); closePopovers(); } });

  var search = document.getElementById("search");

    search.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && search.value.trim()) location.href = "__PREFIX__products.html?q=" + encodeURIComponent(search.value.trim());
    });
  }
})();
