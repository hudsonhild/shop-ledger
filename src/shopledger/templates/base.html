<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Inter:wght@400;500&family=Geist+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#FFFFFF; --side:#FAFAFA; --fg:#0F0F10; --fg2:rgba(0,0,0,.53);
  --muted:rgba(0,0,0,.04); --border:rgba(0,0,0,.075); --control:rgba(0,0,0,.12);
  --primary:hsl(0 0% 18%); --on-primary:#FAFAFA;
  --c1:#93C5FD; --c2:#3B82F6; --c3:#2563EB; --c4:#1D4ED8;
  --ok:#16803D; --ok-bg:rgba(22,128,61,.10);
  --warn-bg:rgba(0,0,0,.05);
  --bad:#DC2626; --bad-bg:rgba(220,38,38,.10);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:hsl(240 3% 6%); --side:hsl(240 6% 10%); --fg:#FFFFFF; --fg2:rgba(255,255,255,.64);
  --muted:rgba(255,255,255,.05); --border:rgba(255,255,255,.075); --control:rgba(255,255,255,.13);
  --primary:hsl(210 20% 98%); --on-primary:hsl(240 3% 6%);
  --ok:#4ADE80; --ok-bg:rgba(74,222,128,.12);
  --warn-bg:rgba(255,255,255,.06);
  --bad:#F87171; --bad-bg:rgba(248,113,113,.12);
}}
:root[data-theme="dark"]{
  --bg:hsl(240 3% 6%); --side:hsl(240 6% 10%); --fg:#FFFFFF; --fg2:rgba(255,255,255,.64);
  --muted:rgba(255,255,255,.05); --border:rgba(255,255,255,.075); --control:rgba(255,255,255,.13);
  --primary:hsl(210 20% 98%); --on-primary:hsl(240 3% 6%);
  --ok:#4ADE80; --ok-bg:rgba(74,222,128,.12);
  --warn-bg:rgba(255,255,255,.06);
  --bad:#F87171; --bad-bg:rgba(248,113,113,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}

.shell{display:flex;min-height:100vh}

/* sidebar */
.side{flex:0 0 208px;width:208px;background:var(--side);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 0;font-weight:500;font-size:14px;letter-spacing:-.01em}
.brand .glyph{flex:0 0 auto}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h6{margin:0 0 6px;padding:0 8px;font-size:11px;line-height:16px;font-weight:400;color:var(--fg2)}
.navgroup a{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:8px;font-size:13px;color:var(--fg);transition:background .15s cubic-bezier(.4,0,.2,1)}
.navgroup a:hover{background:var(--muted)}
.navgroup a.on{background:var(--muted);font-weight:500}
.navgroup svg{color:var(--fg2);flex:0 0 auto}
.navgroup a.on svg{color:var(--fg)}
.side .foot{margin-top:auto;padding:0 8px;font-family:var(--mono);font-size:10.5px;line-height:16px;color:var(--fg2)}

/* main */
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;height:52px;padding:0 24px;border-bottom:1px solid var(--border)}
.crumb{font-size:13px;color:var(--fg2)}
.crumb a:hover{color:var(--fg)}
.topbar .spacer{flex:1 1 auto}
.content{padding:28px 24px 64px;max-width:1240px;width:100%}

.eyebrow{font-size:12px;line-height:16px;color:var(--fg2);margin:0 0 6px}
h1{font-family:var(--display);font-weight:500;font-size:24px;line-height:30px;letter-spacing:-.006em;margin:0 0 18px}
h2{font-family:var(--display);font-weight:500;font-size:16px;line-height:22px;letter-spacing:-.004em;margin:0}
h3{font-family:var(--display);font-weight:500;font-size:15px;line-height:21px;margin:0 0 10px}
p.note{color:var(--fg2);font-size:13px;line-height:20px;margin:0 0 16px;max-width:74ch}

.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--control);font-size:12.5px;font-weight:500;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--fg);flex:0 0 auto}
.pill.warn .dot{background:var(--bad)}

.ctlbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.ctl{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--control);background:transparent;font-family:inherit;font-size:13px;line-height:20px;font-weight:500;color:var(--fg);white-space:nowrap;cursor:default;transition:background .15s cubic-bezier(.4,0,.2,1)}
a.ctl{cursor:pointer}
a.ctl:hover,button.ctl:hover{background:var(--muted)}
button.ctl{cursor:pointer}
.ctl .lbl{color:var(--fg2);font-weight:400}
.ctl svg{color:var(--fg2);flex:0 0 auto}
input.ctl,select.ctl{cursor:text;font-weight:400;min-width:180px}
select.ctl{cursor:pointer}
input.ctl::placeholder{color:var(--fg2)}

.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:500;line-height:16px;white-space:nowrap}
.badge.up{background:var(--ok-bg);color:var(--ok)}
.badge.down{background:var(--bad-bg);color:var(--bad)}
.badge.flat{background:var(--warn-bg);color:var(--fg2)}

.card{border:1px solid var(--border);border-radius:14px;background:var(--bg);overflow:hidden}

/* metric strip */
.strip{display:flex;overflow-x:auto;scrollbar-width:thin}
.cell{flex:1 0 148px;padding:14px 16px 12px;border-right:1px solid var(--border);border-bottom:2px solid transparent;background:none;text-align:left;font-family:inherit;color:inherit;cursor:pointer;transition:background .15s cubic-bezier(.4,0,.2,1)}
.cell:last-child{border-right:none}
.cell:hover{background:var(--muted)}
.cell[aria-pressed="true"]{background:var(--muted);border-bottom-color:var(--fg)}
.cell .lab{font-size:12px;line-height:16px;color:var(--fg2);margin-bottom:5px;white-space:nowrap}
.cell .val{font-size:19px;line-height:26px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .val small{font-size:12px;font-weight:400;color:var(--fg2)}
.plot{padding:16px 16px 10px;border-top:1px solid var(--border)}
.plot svg{display:block;width:100%;height:170px}
.axis{display:flex;justify-content:space-between;font-size:11px;line-height:16px;color:var(--fg2);padding-top:6px;font-variant-numeric:tabular-nums}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.grid2 .videos{order:-1}}
.panel{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px}
.panel .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel .hd .spacer{flex:1 1 auto}
.panel .hd .meta{font-size:12px;color:var(--fg2)}
.panel .bd{padding:4px 16px 8px}
.panel .bd.flush{padding:0}

.rowitem{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.rowitem:last-child{border-bottom:none}
.rank{font-family:var(--mono);font-size:12px;color:var(--fg2);width:22px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.thumb{flex:0 0 auto;width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--muted);object-fit:cover;display:block}
.thumb.tall{width:40px;height:56px}
.ph{display:flex;align-items:center;justify-content:center}
.ph svg{color:var(--fg2)}
.body{flex:1 1 auto;min-width:0}
.body .t{font-size:13.5px;line-height:19px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.t:hover{text-decoration:underline;text-underline-offset:2px}
.body .s{font-size:12px;line-height:18px;color:var(--fg2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{flex:0 0 auto;text-align:right}
.num .a{font-size:13.5px;line-height:19px;font-weight:500;font-variant-numeric:tabular-nums;display:block}
.num .b{font-size:12px;line-height:18px;color:var(--fg2);font-variant-numeric:tabular-nums}
.share{height:4px;border-radius:2px;background:var(--muted);overflow:hidden;margin-top:6px;max-width:260px}
.share i{display:block;height:100%;background:var(--c3)}

/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{
  text-align:left;font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg2);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
  background:var(--bg);position:sticky;top:0;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--fg)}
thead th[aria-sort]{color:var(--fg)}
thead th .arrow{opacity:0;margin-left:4px}
thead th[aria-sort] .arrow{opacity:1}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.prod{min-width:280px;max-width:420px}
td.prod .wrap{display:flex;gap:10px;align-items:center}
td.prod .t{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.prod .s{font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-row td{padding:32px 14px;text-align:center;color:var(--fg2)}

.health{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:16px;padding:16px;border:1px solid var(--border);border-radius:14px}
.health .u{display:flex;flex-direction:column;gap:3px}
.health .u .k{font-size:12px;color:var(--fg2)}
.health .u .v{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}

.empty{padding:44px 16px;text-align:center;color:var(--fg2)}
.empty svg{color:var(--fg2);opacity:.5;margin-bottom:10px}
.empty p{margin:0;font-size:13px;line-height:20px}
.empty p+p{margin-top:4px;font-size:12px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px;padding:14px 16px}
.kv dt{color:var(--fg2)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}

@media (max-width:760px){
  .shell{flex-direction:column}
  .side{
    flex:0 0 auto;width:100%;border-right:none;border-bottom:1px solid var(--border);
    flex-direction:row;align-items:center;gap:0;padding:8px 12px;
    overflow-x:auto;scrollbar-width:none;
  }
  .side::-webkit-scrollbar{display:none}
  .side .brand{padding:0 12px 0 4px;white-space:nowrap;flex:0 0 auto}
  .side .foot{display:none}
  .navgroup{flex-direction:row;gap:4px;flex:0 0 auto}
  .navgroup h6{display:none}
  .navgroup a{white-space:nowrap;padding:0 10px}
  .topbar{height:auto;padding:10px 16px;gap:8px}
  .topbar .crumb{display:none}
  .topbar .spacer{display:none}
  .content{padding:20px 16px 48px}
  td.prod{min-width:200px}
  h1{font-size:21px;line-height:27px}
  .cell{flex:1 0 128px}
  input.ctl,select.ctl{min-width:0;flex:1 1 160px}
  .ctlbar{gap:6px}
  .health{gap:10px 20px}
}
@media (max-width:420px){
  .side .brand .name{display:none}
  .navgroup a{font-size:12.5px;padding:0 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="side">
    <div class="brand">__WORDMARK__<span class="name">Shop Ledger</span></div>
    __NAV__
    <div class="foot">__FOOT__</div>
  </nav>
  <main class="main">
    <div class="topbar">
      <span class="crumb">__CRUMB__</span>
      <span class="spacer"></span>
      __RUNPILL__
      <span class="pill">__CREDITS__ credits</span>
    </div>
    <div class="content">__CONTENT__</div>
  </main>
</div>
__SCRIPT__
</body>
</html>
