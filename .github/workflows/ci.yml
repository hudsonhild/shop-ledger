name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke the CLI
        run: |
          shop-ledger init
          shop-ledger status
          shop-ledger render --offline --out /tmp/site
          for page in index products videos creators health; do
            test -s "/tmp/site/$page.html" || { echo "missing $page.html"; exit 1; }
          done
          ! grep -rq "__[A-Z_]*__" /tmp/site/*.html || { echo "unreplaced token"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
